[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — every non-asset path serves index.html so React
# can handle /projects/<slug> on a direct refresh or shared link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
